(function (root, factory) {
  const api = factory();

  const normalize = value => String(value || '').toLowerCase().replace(/\s+/g, ' ').trim();

  function search(records, query, limit = 5) {
    const q = normalize(query);
    if (!q) return [];
    const explicit = records.filter(r => q.includes(normalize(r['遗址名称'])) || q.includes(normalize(r['遗产ID'])));
    const terms = new Set(q.split(/[\s，。？?,、：:]+/).filter(t => t.length > 1 && !ignored.has(t)));

      const name = normalize(record['遗址名称']);
      const short = normalize([name, record['区县'], record['遗产二级类型'],record['地级行政区']].join(' '));
      const body = normalize([record['遗址概况'], record['历史沿革']].join(' '));
      let score = explicit.includes(record) ? 100 : 0;
      if (name.includes(q)) score += 50;
      for (const term of terms) {
        if (short.includes(term)) score += term.length > 2 ? 12 : 4;
        if (body.includes(term)) score += term.length > 2 ? 4 : 1;
      }
      return { record, score };
    }).filter(x => x.score > 0).sort((a,b) => b.score - a.score).slice(0, limit);
  }

      source: '01_遗产主表', row: record['原表行号'],
      text: parts.map(k => `${k}：${record[k]}`).join('\n').slice(0, maxLength)
    };
  }

async function ask(q){

  else{
   if(location.protocol==='file:')throw Error('离线版不连接 AI 后端。请使用本地服务或配置后的在线站点。');

   if(response.status===404||!String(response.headers.get('content-type')).includes('application/json'))throw Error('此地址尚未部署 AI 后端。GitHub Pages 仅运行静态网页；请取消勾选，继续本地检索。');

  }

}
let selectedFacility='烽堠', placements={};
function gameView(){$('#main').innerHTML=`<section class="page">${heading('LEARN THROUGH PLAY','为海岸，安排一道防线','选择设施，再点击与其主要功能相符的位置。这里是功能教学示意，不代表真实遗址的空间复原。')}<div class="game-options">${['烽堠','炮台','城址'].map(x=>`<button data-facility="${x}" class="${x===selectedFacility?'active':''}">${x}</button>`).join('')}<button id="game-reset">↺ 重新安排</button></div><div class="game-slots">${[['高处观察点','观察远处动静，传递警报信息。','烽堠'],['海口防御点','以火力防御重要水道与海口。','炮台'],['驻防聚落','容纳驻防活动，并组织聚落空间。','城址']].map(([title,desc,answer],i)=>`<button class="slot" data-slot="${i}" data-answer="${answer}"><span class="eyebrow">0${i+1} / FUNCTION</span><b>${title}</b><p>${desc}</p><em>${esc(placements[i]||'点击放置已选设施 +')}</em></button>`).join('')}</div><div class="feedback" id="game-feedback" aria-live="polite">已选择「${selectedFacility}」。请点击一个功能位置。</div><p class="subtle">完成后可进入真实数据库，查找具有相应功能的遗址。具体设施的用途和变化，应以各遗址史料为依据。</p></section>`;$$('[data-facility]').forEach(b=>b.onclick=()=>{selectedFacility=b.dataset.facility;$$('[data-facility]').forEach(x=>x.classList.toggle('active',x===b));$('#game-feedback').textContent=`已选择「${selectedFacility}」。请点击一个功能位置。`});$$('[data-slot]').forEach(b=>b.onclick=()=>{if(selectedFacility===b.dataset.answer){placements[b.dataset.slot]=selectedFacility;$('em',b).textContent=`✓ 已安排：${selectedFacility}`;$('#game-feedback').innerHTML=Object.keys(placements).length===3?'三处功能已完成配对。下一步可到遗产数据库中查看真实案例。 <button id="game-explore" class="primary">探索相关遗存 ↗</button>':`「${selectedFacility}」与此处功能相符。继续选择另一类设施。`;if($('#game-explore'))$('#game-explore').onclick=()=>{query='';cityFilter.clear();typeFilter.clear();navigate('explore')}}else $('#game-feedback').textContent=`再想一想：「${selectedFacility}」的主要作用是否与这里的功能相符？提示：烽堠传警、炮台火力防御、城址承载驻防聚落。`});$('#game-reset').onclick=()=>{placements={};selectedFacility='烽堠';gameView()}}
const table=(headers,rows)=>`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const guideSections=[
['01','先理解整体',()=>`<h2>你要制作的，不只是一组页面</h2><p>你的工作是把文化遗产知识整理成可以查询、阅读和验证的内容；AI 帮你把这些规则写成网页。先做“一个遗址能被找到、读懂、追溯出处”的完整流程，再增加更复杂的交互。</p><h3>案例给我们的启发</h3><p>ArchCritic 公开页展示了“知识学习—案例理解—设计实践—AI 评图—反馈学习—版本修改”的闭环，也介绍了知识卡、案例库、知识测试与分阶段评审角色。值得借鉴的是内容之间的关联方式，而不是照搬建筑评图功能。</p>${table(['案例公开页可确认','转译为海防遗产网站'],[['知识卡与案例学习','概念词条 + 遗址档案；每个概念能跳到真实遗址'],['知识测试与反馈学习','功能配对游戏；完成后返回相关知识与记录'],['AI 评图后追问并返回知识','针对遗址提问；回答附证据，能打开原条目'],['版本修改与复盘','保留资料修订、审核和发布版本，区分新旧解释']])}<div class="note">实际访问范围：已查看案例公开介绍页和工作台登录入口。工作台需要账号登录；本次未注册账号、未登录内部功能。因此不能确认内部 GIS、小游戏或具体技术架构。以下技术方案是为你的项目提出的实现建议，不是对案例源码的识别。</div><h3>网页由六部分共同组成</h3>${table(['部分','可以怎样理解','你的项目需要什么'],[['内容与数据库','展览的藏品目录和说明文字','已有 Excel / 飞书多维表格，保留稳定遗产 ID'],['前端界面','观众能看到和操作的展厅','地图、列表、档案页、问答框、小游戏'],['后端服务','处理请求的工作人员','正式接入 AI、飞书同步、审核和权限时再加入'],['地理与媒体资源','地图、照片、扫描件的库房','地理文件与图像文件，分别保留出处和权限'],['AI 检索与回答','先翻资料、再回答的讲解员','文献分段、检索、生成、有据回答和引用跳转'],['发布与维护','开馆和日常管理','可访问网址、私有/公开范围、更新、备份与纠错']])}<p>本版支持 GitHub Pages、离线文件和本地 Node 服务。可选 AI 后端已提供，真实模型尚未配置；未接入实时飞书同步或多人编辑。</p>`],
['02','逐项拆解功能',()=>`<h2>每个功能，具体要准备什么？</h2>${table(['模块','你准备的内容','AI / 开发制作的部分','如何验收'],[['遗产探索','名称、ID、地区、类型、概况、审核状态','搜索、筛选、分页和档案详情','用遗址名能找到记录；空字段显示待补'],['GIS 地图','经纬度、坐标系、来源、定位精度；以后补范围线面','Leaflet 地图、点位点击、筛选联动与图例','坐标无效不上图；无坐标条目仍在列表；点与详情一致'],['历史舆图','原图、图名、版本、年代、收藏机构、页码、权限','第一步图像放大/注释；第二步并排；适合的图才地理叠加','能够回到原图和出处；不把古图畸变当真实空间变化'],['海防体系','起点 ID、终点 ID、关系类型、起止年代、依据','关系图、按时期筛选、点击节点打开档案','包含与军事隶属分开，不能用临近距离推导指挥关系'],['AI 互动问答','已审核的原文片段、来源页码、关联遗址 ID','后台检索资料后调用模型；生成引用与拒答','答案能打开证据；缺材料不编造；密钥只存后端'],['小游戏','学习目标、规则、反馈、对应知识条目','用网页交互先实现一款轻量游戏','手机也能操作；完成后有解释并链接真实遗址'],['后续扩展','明确新功能需要的输入与成果','再逐项增加故事路线、三维模型等','扩展不破坏已有 ID、链接和来源关系']])}<h3>不要一开始做多智能体</h3><p>案例的评审角色对应建筑设计的多个专业判断。你的第一版更需要准确的资料检索、清楚的出处与稳定的地图。先让一个问答流程可核查，再判断是否需要史料、空间与保护等不同角色。</p>`],
['03','用好现有数据库',()=>`<h2>你的 Excel 已经是开发起点</h2><p>无需推倒重建。现有工作簿已经包含主表、关系表、字段字典、枚举字典、质检、同名复核和原始数据，接下来重点是补证据与确认字段语义。</p>${table(['当前实测','数量 / 状态','对网页的影响'],[['遗产记录','282 条，六市','是记录数，不自动等于去重后的独立遗址数'],['有效数值坐标','163 条；坐标系、定位精度均待核','可预览分布，不能据此声称精确定位'],['无坐标','119 条','保留档案，不用城市中心伪装遗址位置'],['遗址概况','269 条有内容；13 条为空','观海卫城等仍需补简介；不把沿革静默替代概况'],['历史沿革','41 条有内容','扩充文献依据后再提高问答覆盖率'],['史料 / 舆图登记','6 条记录，只有文件名','登记不等于拥有网页可读取的图像资源'],['现状信息','保存现状 0 条；照片字段 2 条非空','不能声称已有现状图库或保护现状评价'],['时间信息','起始、终止年份均为空','暂不做精确年度时间筛选，不把朝代自动变成年份'],['数据关系','48 条，合并标为包含/隶属','先展示原表关系，不解释为历史组织网络'],['审核与重复','282 条待复核；4 组同名待核；182 条质检事项','保留质检清单，不自动合并同名或近邻记录']])}<h3>优先完成这五件事</h3><ol><li>先选 10–20 条重点遗址完成“名称—概况—坐标—图片—来源”的完整链条。</li><li>核验坐标来源与坐标系，特别是地图搜索点是否落在遗址本体、入口、纪念设施或相邻地标。</li><li>给主表关联一张“证据/史料表”，不要继续把书名、页码与整段沿革塞在同一格。</li><li>把图片文件名替换为可访问的附件资源，并保留原始文件与使用权限。</li><li>把“可用于 GIS”改为更细的审核条件：有坐标、坐标系已知、位置已核。当前准备度标记不能代替位置审核。</li></ol><h3>保留的关联结构</h3>${table(['表','主要字段','用途'],[['遗产主表（已有）','遗产 ID、名称、地区、类型、概况、坐标、审核状态','所有页面都围绕同一个 ID 关联'],['关系表（已有，需细分）','起点/终点 ID、关系类型、时间、史料 ID、状态','分别表达组成、统辖、协防、通信等关系'],['证据/史料表（建议补）','证据 ID、遗产 ID、书名、版本、卷页、原文、解释、审核状态','支持详情引用、AI 回答、证据核验'],['图像/舆图表（建议补）','资源 ID、遗产 ID、文件地址、年代、出处、权限、配准信息','支持照片与舆图展示'],['知识与互动表（后续）','知识 ID、内容、关联遗址、游戏规则、解释、来源','学习、游戏和问答共享资料']])}<h3>飞书如何继续使用？</h3><p>把飞书作为你的整理与审核工作台。前期使用“导出 Excel → 校验 → 转换网页数据 → 发布新版本”的人工更新方式，容易检查与回滚。需要频繁更新后，再由后端通过飞书接口读取允许发布的记录；令牌不放到浏览器中。</p><p>本原型是这次 Excel 的快照。修改飞书不会自动改变此页面；也没有修改原工作簿里的“未发布”状态。</p>`],
['04','制作 GIS 与舆图',()=>`<h2>先把点位做对，再增加空间分析</h2><h3>GIS 的第一版</h3><ol><li>从主表提取 ID、名称、类型、经纬度及坐标质量字段。</li><li>核验原始坐标系。WGS84、GCJ-02、BD-09 不能只改字段名称就混用；来源未知时先标记待核，避免盲目转换。</li><li>使用 GeoJSON 表达点、线、面；坐标顺序是经度、纬度。Leaflet 直接添加点位时常用纬度、经度，需要注意两种顺序。</li><li>将点击点位与遗产 ID 关联；筛选同时更新地图和列表，缺坐标的记录保留在档案库。</li><li>核对代表性点位后，再加入图层开关、范围面、按时期筛选等功能。</li></ol><p>本次网页使用 Leaflet 与本地保存的浙江行政区边界，不依赖在线瓦片即可展示点位。边界来自 DataV，作为空间概览；原表坐标系待核，二者叠加不代表已经完成坐标统一。</p><h3>历史舆图的两条制作路径</h3>${table(['图像特点','适合的做法','需要的材料'],[['以方位、路线、等级为主，比例失真较大','高分辨率查看、热点注释、与现代地图并排阅读','原图 + 文献说明 + 热点位置与解释'],['存在多个可靠且可识别的空间控制点','先在 GIS 软件做地理配准，再叠加到网页并调透明度','原图 + 控制点 + 目标坐标系 + 配准方法/误差记录']])}<p>不要直接把古图拉伸到现代地图上就称为“古今精确对照”。沿岸岸线、地名和城址边界都可能改变，配准结果需要解释。</p><h3>进入正式公开展示前</h3><p>按实际服务地区核对底图授权、署名、地图展示要求与服务可达性，选定适合的底图来源。此原型为私有审阅用途，尚未完成公开地图发布所需核验。</p><p><a href="https://leafletjs.com/examples/geojson/" target="_blank" rel="noreferrer">Leaflet 官方 GeoJSON 教程 ↗</a> · <a href="https://leafletjs.com/reference.html" target="_blank" rel="noreferrer">Leaflet 官方参考文档 ↗</a></p>`],
['05','制作有依据的 AI',()=>`<h2>先让 AI 找到资料，再让它回答</h2><p>正式问答需要“检索增强生成”，也就是先从你整理的资料中找到相关段落，再把问题与这些段落一起交给模型。你不需要自己训练一个大模型。</p>${table(['步骤','你需要提供','网页背后执行的工作'],[['1. 整理证据','原文、遗产 ID、书名、版本、卷页、审核状态','将材料分成可独立理解的短片段，保留上下文'],['2. 建立索引','确定哪些材料可供问答使用','关键词检索；覆盖扩大后可结合向量语义检索'],['3. 检索相关内容','用户问题与当前遗址','选出相关证据，排除不相关或不允许使用的材料'],['4. 生成回答','回答规则：区分事实、解释、存疑','由后端调用模型，要求只依据检索证据回答'],['5. 展示引用','证据 ID、书名、卷页与原文','让读者一键返回证据卡或遗址详情'],['6. 核验效果','准备一组有答案、无答案和有争议的问题','检查引文真实性、遗漏、混淆与无依据生成']])}<h3>本次已实现什么？</h3><p>Heritage AI 页面当前是<strong>本地关键词检索</strong>，从工作簿的概况与历史沿革中返回原文摘录，并链接到完整记录。没有连接模型，不会冒充已经具备智能推理。</p><h3>下一步给开发 AI 的明确要求</h3><div class="prompt">为现有 Heritage AI 接入后端问答服务。先检索已审核证据，再调用模型。每条回答附有效证据 ID，引用点击后能看到原文及书名卷页。材料不足时明确说“现有材料无法回答”。把事实与解释分开，不新增无依据的年代、尺寸或隶属关系。密钥仅在服务器保存。加入请求失败提示、访问频率限制和用量记录。先用 20 个测试问题检验引用能否支撑回答，再扩大资料量。</div><p>启用外部模型前，由你选定服务与数据使用范围。未审核的原表摘录可以用于私有研究检索，但不应直接成为对公众作确定回答的权威依据。</p>`],
['06','游戏与学习闭环',()=>`<h2>小游戏的目的，是帮助理解</h2><p>先确定一个学习目标，而不是先找一款可以嵌入的游戏。第一版可以教“不同海防设施发挥什么作用”，完成后回到真实遗址阅读，这样交互才与研究内容相连。</p>${table(['层次','示例','制作方式'],[['第一版：小规则、直接操作','选择烽堠、炮台和城址，匹配主要功能','HTML / CSS / JavaScript 即可，不需要大型游戏引擎'],['第二版：带情境的学习','辨别不同设施，比较遗址记录，安排信号传递次序','把内容、判定和解释写成可维护的数据'],['以后：更复杂的空间互动','经证据支持的视线模拟或历史防御情境','准备地形、年代与设施信息；再判断是否需要三维或专用引擎']])}<h3>自己制作还是嵌入外部游戏？</h3><p>自己的轻量游戏更容易连接遗产 ID、学习解释和网站配色。如果外部游戏提供正式嵌入功能，可以在取得使用许可后使用 iframe；先检查手机操作、允许嵌入的域名、加载失败提示与数据收集方式。不能假设任意网址都能直接嵌入。</p><h3>学习闭环怎样形成</h3><p>知识卡介绍烽堠 → 到地图寻找具体遗址 → 阅读依据 → 完成功能游戏 → 查看解释 → 返回相关遗址继续学习。每一步都用遗产 ID 或知识 ID 连接，避免几个模块各自孤立。</p><button class="primary" data-view="game">体验功能配对 →</button>`],
['07','零基础实施顺序',()=>`<h2>按可验收的小步骤，和 AI 一起做</h2><p>你不必先学完整套编程。先学会分清内容、界面和服务；每次只让 AI 完成一个可以点击验证的功能。</p>${table(['阶段','具体行动','交付物与通过条件'],[['A · 完成数据小样','先核验 10–20 条重点遗址；补 ID、简介、坐标来源、证据、图像','每条都可追溯；相同 ID 能贯通各表'],['B · 完成档案与地图','把数据导入网页，制作筛选、列表、地图与详情','找到一个遗址，点击地图可打开对应档案；手机可读'],['C · 接入图像与史料','取得原图，补元数据；先做图像查看与并排阅读','文件可打开、来源可查，不虚构配准精度'],['D · 接入真正 AI','建立审核后的证据索引，加入后端模型调用','有依据的问题能回答；无依据问题不编造；引用有效'],['E · 加入学习游戏','先完成一款功能配对，再视需要扩展','规则清晰，错误有解释，结束能回到真实记录'],['F · 小范围试用再公开','邀请少量同学/老师评估；修订资料与交互','检查权限、资料授权、地图要求、密钥管理、备份与回滚']])}<h3>让 AI 修改网页时这样说</h3><div class="prompt">请在现有浙东海防遗产网站上继续修改，保留现有设计与遗产 ID。
本次只完成：【一个具体功能】。
数据来源：【工作表与字段名】；空白字段显示“待补”，不得编造。
